<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Un momento · Día 9</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #fff; }
    body { display: grid; place-items: center; }
    #transition-image {
      display: block;
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      opacity: 0;
      transition: opacity 1.2s ease-in-out;
    }
    #transition-error {
      position: fixed;
      inset: 16px;
      display: grid;
      place-items: center;
      margin: 0;
      color: #1e293b;
      font: 16px/1.5 Arial, sans-serif;
      text-align: center;
    }
    #transition-error[hidden] { display: none; }
    @media (prefers-reduced-motion: reduce) {
      #transition-image { transition-duration: 500ms; }
    }
  </style>
</head>
<body>
  <img id="transition-image" alt="" aria-hidden="true">
  <p id="transition-error" role="alert" hidden>No se pudieron cargar las imágenes de la transición.</p>
  <script>
    const imageSources = [
      "../../assets/images/jobapplication.jpg",
      "../../assets/images/jobapplication.png"
    ];
    const transitionImage = document.querySelector("#transition-image");
    const transitionError = document.querySelector("#transition-error");
    const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const fadeDuration = reducedMotion ? 500 : 1200;
    const displayDuration = 2500;

    function preloadImage(source) {
      return new Promise((resolve, reject) => {
        const image = new Image();
        image.onload = () => resolve(image);
        image.onerror = () => reject(new Error(`No se pudo cargar ${source}.`));
        image.src = source;
      });
    }

    function wait(milliseconds) {
      return new Promise(resolve => window.setTimeout(resolve, milliseconds));
    }

    function nextFrame() {
      return new Promise(resolve => window.requestAnimationFrame(resolve));
    }

    async function playTransition() {
      try {
        const images = await Promise.all(imageSources.map(preloadImage));

        for (const image of images) {
          transitionImage.src = image.src;
          await nextFrame();
          transitionImage.style.opacity = "1";
          await wait(fadeDuration + 50);
          await wait(displayDuration);
          transitionImage.style.opacity = "0";
          await wait(fadeDuration + 50);
        }

        window.location.replace("index.html");
      } catch (error) {
        console.error("Falló la transición visual del Día 9.", error);
        transitionError.hidden = false;
      }
    }

    void playTransition();
  </script>
</body>
</html>
