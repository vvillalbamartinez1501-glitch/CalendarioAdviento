<!doctype html>
<html lang="es">
<head>
  <link rel="icon" type="image/jpeg" href="../../assets/images/jackysallyheart.jpg">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="../../arrival-transition.js"></script>
  <meta name="theme-color" content="#0A192F">
  <meta name="description" content="Día 20: un recuerdo navideño para compartir y guardar.">
  <title>Día 20 · Navigram</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Pacifico&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
  <script src="../../assets/js/tracker.js" defer></script>
</head>
<body>
  <div class="snowfall" id="snowfall" aria-hidden="true"></div>

  <main class="phone-frame" id="app">
    <header class="topbar">
      <a class="calendar-link" href="../../index.html" aria-label="Volver al calendario">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6M9 12h11"/></svg>
        <span>Calendario</span>
      </a>
      <a class="brand" href="#app" aria-label="Navigram, Día 20">
        <span>Navigram</span>
        <svg class="brand-snowflake" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 2v20M3.34 7l17.32 10M3.34 17 20.66 7M8.5 4l3.5 2 3.5-2M8.5 20l3.5-2 3.5 2M4.6 10l.1-4 3.4-2M19.4 14l-.1 4-3.4 2M4.6 14l.1 4 3.4 2M19.4 10l-.1-4-3.4-2"/>
        </svg>
        <small>• DÍA 20</small>
      </a>
      <span class="topbar-spacer" aria-hidden="true"></span>
    </header>

    <section class="stories-section" aria-label="Stories de Navidad">
      <div class="stories-list">
        <button class="story" type="button" data-story="0" aria-label="Ver story: Job applications">
          <span class="story-ring story-ring--text" aria-hidden="true">JOB</span>
          <span class="story-name">Job applications</span>
        </button>
        <button class="story" type="button" data-story="1" aria-label="Ver story: Espíritus Fortnite">
          <span class="story-ring"><img src="../../assets/images/espiritu-fortnite-ghost-cat.jpg" alt="Gato fantasma de Fortnite"></span>
          <span class="story-name">Espíritus Fortnite</span>
        </button>
        <button class="story" type="button" data-story="2" aria-label="Ver story: Stickers">
          <span class="story-ring"><img src="../../assets/images/sticker01.jpeg" alt="Sticker de los dos abrazándose"></span>
          <span class="story-name">Stickers</span>
        </button>
        <button class="story" type="button" data-story="3" aria-label="Ver story: Navidad">
          <!-- HUECO STORY 4 -->
          <span class="story-ring"><img src="../../assets/images/jackysally.jpg" alt="Recuerdo de Navidad"></span>
          <span class="story-name">Navidad</span>
        </button>
      </div>
    </section>

    <header class="feed-heading">
      <h1>Nuestros recuerdos</h1>
      <p>Un poco de doomscrolling con sentido.</p>
    </header>

    <section class="post-feed" id="post-feed" aria-label="Publicaciones de nuestro álbum">
      <template id="post-template">
        <article class="post">
          <header class="post-header">
            <img class="profile-avatar" alt="">
            <div class="post-identity">
              <strong class="post-username"></strong>
              <span class="post-location"></span>
            </div>
            <button class="more-button" type="button" data-action="more" aria-label="Más opciones">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>
            </button>
          </header>

          <figure class="post-figure">
            <div class="post-artwork">
              <div class="artwork-fallback" aria-hidden="true">
                <span class="artwork-label">UN RECUERDO PARA GUARDAR</span>
                <span class="artwork-snowflake artwork-snowflake--one">❄</span>
                <span class="artwork-snowflake artwork-snowflake--two">✳</span>
                <div class="artwork-copy">
                  <span class="artwork-overline">NUESTRO PEQUEÑO</span>
                  <span class="artwork-title">Invierno<br>juntos</span>
                  <span class="artwork-date">DICIEMBRE · DÍA 20</span>
                </div>
                <span class="artwork-footnote">TQM <span aria-hidden="true">♥</span></span>
              </div>
              <img class="post-image" alt="" hidden>
              <span class="double-tap-heart" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1.1L12 21l7.8-7.5 1.1-1.1a5.5 5.5 0 0 0-.1-7.8Z"/></svg>
              </span>
            </div>
            <figcaption class="sr-only"></figcaption>
          </figure>

          <div class="post-actions">
            <div class="action-group">
              <button class="icon-button like-button" type="button" data-action="like" aria-label="Me gusta" aria-pressed="false">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1.1L12 21l7.8-7.5 1.1-1.1a5.5 5.5 0 0 0-.1-7.8Z"/></svg>
              </button>
              <button class="icon-button comment-button" type="button" data-action="comment" aria-label="Ver mensaje">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.2 11.5a8.2 8.2 0 0 1-8.5 7.8 9 9 0 0 1-3.8-.8L3 20l1.5-4.1a7.5 7.5 0 0 1-1.2-4.1A8.2 8.2 0 0 1 12 4a8.2 8.2 0 0 1 8.2 7.5Z"/></svg>
              </button>
            </div>
            <button class="icon-button save-button" type="button" data-action="save" aria-label="Guardar publicación" aria-pressed="false">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4.8A1.8 1.8 0 0 1 7.8 3h8.4A1.8 1.8 0 0 1 18 4.8V21l-6-4-6 4V4.8Z"/></svg>
            </button>
          </div>
          <p class="like-count"><strong></strong> Me gusta</p>

          <div class="caption">
            <p><strong class="caption-username"></strong> <span class="caption-text"></span></p>
            <time></time>
          </div>
        </article>
      </template>
    </section>
    <p class="app-footer">HECHO CON AMOR <span aria-hidden="true">♥</span></p>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </main>
  <section class="story-viewer" id="story-viewer" role="dialog" aria-modal="true" aria-label="Story de Navidad" hidden>
    <div class="story-progress" id="story-progress" aria-hidden="true"></div>
    <button class="story-close" id="story-close" type="button" aria-label="Cerrar story">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
    </button>
    <button class="story-nav story-nav--previous" id="story-previous" type="button" aria-label="Story anterior"></button>
    <img class="story-viewer-image" id="story-viewer-image" src="../../assets/images/jackysally.jpg" alt="">
    <div class="story-shade" aria-hidden="true"></div>
    <div class="story-viewer-copy">
      <span class="story-viewer-eyebrow" id="story-viewer-eyebrow">Un feed bien construido</span>
      <!-- <p id="story-caption"></p> -->
    </div>
    <button class="story-nav story-nav--next" id="story-next" type="button" aria-label="Siguiente story"></button>
  </section>
</body>
</html>
